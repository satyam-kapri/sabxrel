services:
  web:
    build: .
    ports:
      - "8000:8000"
    environment:
      PORT: "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/metadata')"]
      interval: 30s
      timeout: 10s
      start_period: 15s
      retries: 3
